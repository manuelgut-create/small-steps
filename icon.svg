<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Small Steps">
  <!--
    The app mark: three ascending steps, the earlier ones still visibly counted.
    Same geometry as the app icon in docs/store/assets-src/icon-full.html.
    Kept as a local file so the site loads nothing from a third party.
  -->
  <rect width="64" height="64" rx="12" fill="#2F6F62" />
  <g fill="#fff">
    <rect x="17.5" y="36" width="7" height="12" rx="2" opacity=".5" />
    <rect x="28.5" y="27" width="7" height="21" rx="2" opacity=".75" />
    <rect x="39.5" y="16" width="7" height="32" rx="2" />
  </g>
</svg>
